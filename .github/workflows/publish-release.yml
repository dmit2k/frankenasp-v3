name: Publish manually tagged FrankenASP release

on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

jobs:
  publish:
    name: Verify staged archives before GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact source tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout independently staged release archives
        uses: actions/checkout@v4
        with:
          ref: release-assets/${{ github.ref_name }}
          path: release-assets
          persist-credentials: false

      - name: Configure reproducible Go validator
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true

      - name: Verify tag, source commit, and exact release inventory
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(cat VERSION)"
          test "$(cat release-assets/COMMIT)" = "$GITHUB_SHA"
          test "$(cat release-assets/TAG)" = "$TAG"
          GOTOOLCHAIN=local GOFLAGS=-p=2 GOMAXPROCS=2 \
            go build -trimpath -o "$RUNNER_TEMP/asp-release-verify" ./common-tools/asp-release/cmd
          python3 scripts/verify-release-inventory.py \
            --dir release-assets --tag "$TAG" \
            --validator "$RUNNER_TEMP/asp-release-verify" \
            --output "$RUNNER_TEMP/verified-release-assets.txt"

      - name: Publish GitHub Release with validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${TAG}.md"
          test -s "$notes_file" || { echo "Missing release notes: $notes_file" >&2; exit 1; }
          mapfile -t assets < "$RUNNER_TEMP/verified-release-assets.txt"
          test "${#assets[@]}" -ge 2
          for entry in "${assets[@]}"; do
            test -s "$entry"
          done
          gh release create "$TAG" "${assets[@]}" release-assets/SHA256SUMS \
            --verify-tag \
            --latest \
            --title "FrankenASP ${TAG#v}" \
            --notes-file "$notes_file"
