name: Publish manually tagged FrankenASP release

on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

jobs:
  publish:
    name: Verify staged binaries and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout separately staged, platform-specific archives
        uses: actions/checkout@v4
        with:
          ref: release-assets/${{ github.ref_name }}
          path: release-assets
          persist-credentials: false

      - name: Verify tag, source commit, and archive checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$(cat VERSION)"
          test "$(cat release-assets/COMMIT)" = "$GITHUB_SHA"
          test "$(cat release-assets/TAG)" = "$TAG"
          cd release-assets
          sha256sum --check --strict SHA256SUMS
          for platform in athena rook; do
            test -s "frankenasp-${TAG}-${platform}-arm32.tar.gz"
            tar -tzf "frankenasp-${TAG}-${platform}-arm32.tar.gz" | grep -Fx "frankenasp-${platform}/asp-installer"
          done

      - name: Publish GitHub Release with validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="docs/releases/${TAG}.md"
          test -s "$notes_file" || { echo "Missing release notes: $notes_file" >&2; exit 1; }
          gh release create "$TAG" \
            "release-assets/frankenasp-${TAG}-athena-arm32.tar.gz" \
            "release-assets/frankenasp-${TAG}-rook-arm32.tar.gz" \
            "release-assets/SHA256SUMS" \
            --verify-tag \
            --title "FrankenASP ${version}" \
            --notes-file "$notes_file"
